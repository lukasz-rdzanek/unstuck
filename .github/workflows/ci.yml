name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Newest run per ref wins: a fresh push cancels an in-flight run (incl. a
# mid-flight deploy) so prod reflects the latest master; PR runs are likewise
# de-duped per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The remote-only AI binding (ai-answer-matching) makes the Cloudflare vite
      # plugin open a remote proxy session during `astro sync` + `build`; CI must
      # authenticate non-interactively via these tokens or those steps fail with
      # "must be logged in to use wrangler dev in remote mode". Scoped per-step
      # (not job-level) so they stay out of `npm ci`'s postinstall environment.
      - run: npx astro sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # CD: deploy to Cloudflare on push to master, only after `ci` passes. Auto on
  # green (no manual gate); DB migrations stay manual (run `supabase db push`
  # before merging a migration-bearing change).
  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Hard guard: never ship a localhost-pointing client bundle (the exact bug
      # that broke the first MVP deploy). Require the prod Supabase ref present
      # and zero local refs in dist/.
      - name: Leak-check dist
        run: |
          if grep -rqE "127\.0\.0\.1:54321" dist/; then
            echo "::error::localhost Supabase ref found in dist/ — refusing to deploy"; exit 1
          fi
          if ! grep -rq "rhcioqeawpbuylbmkxnr" dist/; then
            echo "::error::prod Supabase ref NOT found in dist/ — build env likely wrong"; exit 1
          fi
          echo "leak-check passed: prod ref present, no localhost"
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Integration tests against a real local Supabase stack (RLS + definer
  # functions, Phases 1–2 of the test rollout). Boots Docker via `supabase
  # start`, which applies migrations + seed. Deliberately ADDITIVE and isolated:
  # PR-triggered (+ manual dispatch) only, NOT in `deploy.needs`, and carries no
  # secrets (the local stack ships demo keys) — a Docker flake here must never
  # wedge prod deploy or the fast `ci` gate.
  integration:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.98.2
      - run: supabase start
      - run: npm run test:integration
      - name: Supabase status on failure
        if: failure()
        run: supabase status || true
