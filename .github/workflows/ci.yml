name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Newest run per ref wins: a fresh push cancels an in-flight run (incl. a
# mid-flight deploy) so prod reflects the latest master; PR runs are likewise
# de-duped per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The remote-only AI binding (ai-answer-matching) makes the Cloudflare vite
      # plugin open a remote proxy session during `astro sync` + `build`; CI must
      # authenticate non-interactively via these tokens or those steps fail with
      # "must be logged in to use wrangler dev in remote mode". Scoped per-step
      # (not job-level) so they stay out of `npm ci`'s postinstall environment.
      - run: npx astro sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # CD: deploy to Cloudflare on push to master, only after `ci` passes. Auto on
  # green (no manual gate); DB migrations stay manual (run `supabase db push`
  # before merging a migration-bearing change).
  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Hard guard: never ship a localhost-pointing client bundle (the exact bug
      # that broke the first MVP deploy). Require the prod Supabase ref present
      # and zero local refs in dist/.
      - name: Leak-check dist
        run: |
          if grep -rqE "127\.0\.0\.1:54321" dist/; then
            echo "::error::localhost Supabase ref found in dist/ — refusing to deploy"; exit 1
          fi
          if ! grep -rq "rhcioqeawpbuylbmkxnr" dist/; then
            echo "::error::prod Supabase ref NOT found in dist/ — build env likely wrong"; exit 1
          fi
          echo "leak-check passed: prod ref present, no localhost"
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Integration tests against a real local Supabase stack (RLS + definer
  # functions, Phases 1–2 of the test rollout). Boots Docker via `supabase
  # start`, which applies migrations + seed. Deliberately ADDITIVE and isolated:
  # PR-triggered (+ manual dispatch) only, NOT in `deploy.needs`, and carries no
  # secrets (the local stack ships demo keys) — a Docker flake here must never
  # wedge prod deploy or the fast `ci` gate.
  integration:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          # Keep in sync with the `supabase` devDep in package.json (currently
          # resolves to 2.98.2). They only match by lockfile today — bump both
          # together so CI exercises the same migration/seed engine as local.
          version: 2.98.2
      - run: supabase start
      - run: npm run test:integration
      - name: Supabase status on failure
        if: failure()
        run: supabase status || true

  # Browser-level E2E (Playwright) against the real app + local Supabase (m3l4).
  # Same isolation contract as `integration`: PR-triggered + manual dispatch only,
  # NOT in `deploy.needs`. Boots the local stack (seed.sql has the course/lesson/
  # test), mints the login-capable e2e user via the admin API (empty-password
  # seed users can't log in), writes the local Supabase keys to .dev.vars so the
  # dev server reads them, and runs the suite. Needs the CF tokens because the
  # dev server opens a remote AI-binding session on boot (same reason as `ci`).
  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.98.2 # keep in sync with the `supabase` devDep (see `integration`)
      - run: supabase start
      - name: Seed the e2e login user
        run: node e2e/setup/seed-e2e-user.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Point the dev server at the local stack
        run: |
          STATUS=$(supabase status -o json)
          {
            echo "SUPABASE_URL=$(echo "$STATUS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).API_URL))')"
            echo "SUPABASE_KEY=$(echo "$STATUS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).ANON_KEY))')"
          } >> .dev.vars
      - name: Run E2E
        run: npm run test:e2e
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload E2E traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
